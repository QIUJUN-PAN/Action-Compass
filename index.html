<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Action Compass</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="welcome-page">

      <div class="welcome-content">

        <!-- 左侧：产品介绍 -->
        <section class="welcome-text">

            <p class="product-name">
                Action Compass
            </p>

            <h1>
                なんとなくスマホを見る、<br>
                その前に。
            </h1>

            <p class="welcome-description">
                やることがないわけじゃない。<br>
                でも、気づけばまたスマホを見ている。
            </p>

            <p class="welcome-description">
                Action Compassは、登録した「やりたいこと」の中から、<br>
                今すぐできることをランダムに提案します。
            </p>

            <button id="start-button">
                はじめる →
            </button>

        </section>


        <!-- 右侧：插画 -->
        <section class="welcome-visual">

            <img
                src="image-elements/smartphone_chudoku.png"
                alt="スマートフォン中毒のイラスト"
            >

        </section>

      </div>

    </main>

    <script src="index.js"></script>

</body>

</html>
